<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Башцап</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #fff;
        }

        .app {
            width: 100%;
            height: 100%;
            display: flex;
            overflow: hidden;
        }

        /* Левая панель */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: #f0f0f0;
            border-right: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar-header {
            background: #00A651;
            color: white;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
        }

        .add-contact-btn {
            background: white;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .search-box {
            padding: 8px;
            background: white;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 15px;
            outline: none;
            font-size: 13px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .chat-item {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
        }

        .chat-item:active {
            background: #e0e0e0;
        }

        .chat-item.active {
            background: #c8e6c9;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #0073B5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 3px;
        }

        .chat-preview {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-time {
            font-size: 11px;
            color: #999;
            flex-shrink: 0;
        }

        /* Правая панель */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #e5ddd5;
            height: 100%;
            min-width: 0;
        }

        .chat-header {
            background: #00A651;
            color: white;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .back-btn {
            display: none;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 5px;
            margin-right: 5px;
        }

        .back-btn svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        .chat-header .avatar {
            width: 38px;
            height: 38px;
            font-size: 15px;
        }

        .chat-header-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header-name {
            font-weight: 600;
            font-size: 15px;
        }

        .chat-header-status {
            font-size: 12px;
            opacity: 0.9;
        }

        .chat-actions {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }

        .chat-actions svg {
            width: 20px;
            height: 20px;
            cursor: pointer;
            fill: white;
        }

        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 8px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .message.received {
            background: white;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.sent {
            background: #dcf8c6;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .message-time {
            font-size: 10px;
            color: #666;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 3px;
        }

        .message-time svg {
            width: 12px;
            height: 12px;
            flex-shrink: 0;
        }

        .input-area {
            background: #f0f0f0;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #ccc;
            flex-shrink: 0;
        }

        .input-area svg {
            width: 22px;
            height: 22px;
            cursor: pointer;
            fill: #666;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            min-width: 0;
        }

        .send-btn {
            background: #00A651;
            border: none;
            padding: 8px 14px;
            border-radius: 18px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            flex-shrink: 0;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
            text-align: center;
            padding: 40px;
        }

        .empty-state svg {
            width: 70px;
            height: 70px;
            fill: #ccc;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #666;
        }

        .empty-state p {
            font-size: 13px;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 380px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .modal-header h2 {
            color: #00A651;
            font-size: 18px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            color: #999;
            line-height: 1;
            padding: 0 5px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #666;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #00A651;
        }

        .submit-btn {
            background: #00A651;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-top: 5px;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: #00A651;
            border-radius: 3px;
        }

        /* МОБИЛЬНАЯ ВЕРСИЯ */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                min-width: 100%;
                border-right: none;
            }

            .chat-area {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                transform: translateX(100%);
                transition: transform 0.25s ease;
                z-index: 10;
            }

            .app.chat-open .chat-area {
                transform: translateX(0);
            }

            .back-btn {
                display: flex;
                align-items: center;
            }

            .chat-actions svg:nth-child(2),
            .chat-actions svg:nth-child(3) {
                display: none;
            }

            .input-area svg:nth-child(1),
            .input-area svg:nth-child(2),
            .input-area svg:nth-child(4) {
                display: none;
            }

            .send-btn {
                display: none;
            }

            .input-area {
                padding: 8px 10px;
            }

            .input-area input {
                padding: 10px 14px;
            }

            .message {
                max-width: 85%;
            }

            .messages {
                padding: 10px;
            }

            .logo-text {
                font-size: 18px;
            }

            .logo-icon {
                width: 34px;
                height: 34px;
            }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- Левая панель -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo-section">
                    <div class="logo-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="#00A651">
                            <path d="M12 2C6.48 2 2 6.48 2 12c0 1.82.5 3.53 1.36 5L2 22l5-1.36C8.47 21.5 10.18 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.58 0-3.07-.41-4.36-1.13l-.31-.18-2.96.79.79-2.96-.18-.31C4.41 15.07 4 13.58 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8z"/>
                            <path d="M15.5 14.5c-.28-.14-1.65-.82-1.9-.92-.25-.1-.44-.14-.63.14-.19.28-.73.92-.9 1.11-.17.19-.33.21-.61.07-.28-.14-1.18-.44-2.25-1.39-.83-.74-1.39-1.65-1.55-1.93-.17-.28-.02-.43.13-.57.13-.13.28-.33.42-.5.14-.17.19-.28.28-.47.09-.19.05-.35-.02-.49-.07-.14-.63-1.52-.86-2.08-.23-.55-.46-.47-.63-.48-.16-.01-.35-.01-.54-.01-.19 0-.5.07-.76.35-.26.28-1 .98-1 2.39s1.02 2.77 1.16 2.96c.14.19 2 3.06 4.85 4.29.68.29 1.21.47 1.62.6.68.22 1.3.19 1.79.12.55-.08 1.65-.67 1.88-1.32.23-.65.23-1.2.16-1.32-.07-.12-.25-.19-.53-.33z"/>
                        </svg>
                    </div>
                    <div class="logo-text">Башцап</div>
                </div>
                <button class="add-contact-btn" onclick="openModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#00A651">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                </button>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Поиск..." oninput="searchChats()">
            </div>
            
            <div class="chat-list" id="chatList"></div>
        </div>
        
        <!-- Правая панель -->
        <div class="chat-area">
            <div class="empty-state" id="emptyState">
                <svg viewBox="0 0 24 24">
                    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                </svg>
                <h3>Башцап</h3>
                <p>Выберите чат или добавьте новый контакт</p>
            </div>
            
            <div id="chatContent" style="display: none; flex: 1; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <button class="back-btn" onclick="closeChat()">
                        <svg viewBox="0 0 24 24">
                            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                        </svg>
                    </button>
                    <div class="avatar" id="chatAvatar">А</div>
                    <div class="chat-header-info">
                        <div class="chat-header-name" id="chatName">Имя</div>
                        <div class="chat-header-status">в сети</div>
                    </div>
                    <div class="chat-actions">
                        <svg viewBox="0 0 24 24">
                            <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
                        </svg>
                        <svg viewBox="0 0 24 24">
                            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                        </svg>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                        </svg>
                    </div>
                </div>
                
                <div class="messages" id="messages"></div>
                
                <div class="input-area">
                    <svg viewBox="0 0 24 24">
                        <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
                    </svg>
                    <svg viewBox="0 0 24 24">
                        <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
                    </svg>
                    <input type="text" id="messageInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter')sendMessage()">
                    <svg onclick="sendMessage()" viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                    <button class="send-btn" onclick="sendMessage()">Отпр.</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Новый контакт</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>Имя</label>
                <input type="text" id="contactName" placeholder="Например: Айгуль">
            </div>
            <div class="form-group">
                <label>Телефон</label>
                <input type="text" id="contactPhone" placeholder="+7 (___) ___-__-__">
            </div>
            <button class="submit-btn" onclick="addContact()">Добавить</button>
        </div>
    </div>

    <script>
        let contacts = [
            { id: 1, name: 'Айгуль', phone: '+7 987 654 32 10', messages: [
                { text: 'Салам! Как дела?', type: 'received', time: '12:25' },
                { text: 'Ва-алейкум салам! Всё отлично!', type: 'sent', time: '12:26' }
            ]},
            { id: 2, name: 'Рустам', phone: '+7 987 654 32 11', messages: [
                { text: 'Видел курая нового?', type: 'received', time: '11:45' }
            ]},
            { id: 3, name: 'Булат', phone: '+7 987 654 32 12', messages: [
                { text: 'Мёд привезу с пасеки 🍯', type: 'received', time: 'Вчера' }
            ]}
        ];
        
        let currentChat = null;
        let nextId = 4;

        function loadData() {
            const saved = localStorage.getItem('bashcap_data');
            if (saved) {
                const data = JSON.parse(saved);
                contacts = data.contacts || contacts;
                nextId = data.nextId || 4;
            }
        }

        function saveData() {
            localStorage.setItem('bashcap_data', JSON.stringify({ contacts, nextId }));
        }

        function renderChatList() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            
            contacts.forEach(contact => {
                const lastMsg = contact.messages[contact.messages.length - 1];
                const preview = lastMsg ? lastMsg.text : 'Нет сообщений';
                const time = lastMsg ? lastMsg.time : '';
                
                const div = document.createElement('div');
                div.className = 'chat-item' + (currentChat === contact.id ? ' active' : '');
                div.onclick = () => openChat(contact.id);
                div.innerHTML = `
                    <div class="avatar">${contact.name[0]}</div>
                    <div class="chat-info">
                        <div class="chat-name">${contact.name}</div>
                        <div class="chat-preview">${preview}</div>
                    </div>
                    <div class="chat-time">${time}</div>
                `;
                list.appendChild(div);
            });
        }

        function openChat(id) {
            currentChat = id;
            const contact = contacts.find(c => c.id === id);
            
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('chatContent').style.display = 'flex';
            
            document.getElementById('chatAvatar').textContent = contact.name[0];
            document.getElementById('chatName').textContent = contact.name;
            
            renderMessages();
            renderChatList();
            
            document.getElementById('app').classList.add('chat-open');
            
            setTimeout(() => {
                document.getElementById('messageInput').focus();
            }, 300);
        }

        function closeChat() {
            document.getElementById('app').classList.remove('chat-open');
            currentChat = null;
            renderChatList();
        }

        function renderMessages() {
            const contact = contacts.find(c => c.id === currentChat);
            if (!contact) return;
            const container = document.getElementById('messages');
            container.innerHTML = '';
            
            contact.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message ' + msg.type;
                div.innerHTML = `
                    <div class="message-text">${msg.text}</div>
                    <div class="message-time">
                        ${msg.time}
                        ${msg.type === 'sent' ? '<svg viewBox="0 0 24 24" fill="#4CAF50"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' : ''}
                    </div>
                `;
                container.appendChild(div);
            });
            
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentChat) return;
            
            const contact = contacts.find(c => c.id === currentChat);
            const now = new Date();
            const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            
            contact.messages.push({ text, type: 'sent', time });
            input.value = '';
            
            renderMessages();
            renderChatList();
            saveData();
            
            setTimeout(() => {
                const responses = [
                    'Здорово! 😊',
                    'Понятно!',
                    'Интересно',
                    'Хорошо, договорились!',
                    'Отлично! 👍',
                    'Супер!',
                    'Салам! Как дела?'
                ];
                const response = responses[Math.floor(Math.random() * responses.length)];
                const rTime = new Date();
                const timeStr = rTime.getHours().toString().padStart(2, '0') + ':' + rTime.getMinutes().toString().padStart(2, '0');
                
                contact.messages.push({ text: response, type: 'received', time: timeStr });
                
                if (currentChat === contact.id) {
                    renderMessages();
                }
                renderChatList();
                saveData();
            }, 1500);
        }

        function openModal() {
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('contactName').value = '';
            document.getElementById('contactPhone').value = '';
        }

        function addContact() {
            const name = document.getElementById('contactName').value.trim();
            const phone = document.getElementById('contactPhone').value.trim();
            
            if (!name) {
                alert('Введите имя!');
                return;
            }
            
            contacts.push({
                id: nextId++,
                name: name,
                phone: phone || 'Нет номера',
                messages: []
            });
            
            closeModal();
            renderChatList();
            saveData();
            openChat(nextId - 1);
        }

        function searchChats() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.chat-item');
            
            items.forEach((item, index) => {
                if (contacts[index]) {
                    const name = contacts[index].name.toLowerCase();
                    item.style.display = name.includes(query) ? 'flex' : 'none';
                }
            });
        }

        // Закрытие модалки по клику вне её
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Инициализация
        loadData();
        renderChatList();
    </script>
</body>
</html>
